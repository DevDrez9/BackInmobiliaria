version: '3.8'

services:
  db:
    container_name: inmobiliarias-db
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inmobiliaria}
      MYSQL_USER: ${MYSQL_USER:-inmobiliariaUser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pa$$Inmobiliaria9}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pa$$Inmobiliaria9}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: inmobiliarias-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3003:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql_data:
