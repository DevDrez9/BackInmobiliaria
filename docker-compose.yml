version: '3.8'

services:
  backend:
    container_name: inmobiliarias-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3005:3000"
    env_file:
      - .env          # El .env debe estar en el mismo directorio que este compose
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads